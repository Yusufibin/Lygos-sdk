[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lygos-sdk"
version = "0.2.0"
description = "Unofficial Python client for the Lygos gateway API with bounded requests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Yusufibin"}]
dependencies = ["requests>=2.32,<3"]

[project.urls]
Repository = "https://github.com/Yusufibin/Lygos-sdk"
Documentation = "https://docs.lygosapp.com"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["lygos_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
