name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Install wheel outside the source tree
        run: |
          python -m venv /tmp/lygos-wheel
          /tmp/lygos-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/lygos-wheel/bin/python -c "from lygos_sdk import LygosClient; LygosClient('offline-smoke-test').close()"
